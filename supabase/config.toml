# supabase/config.toml — TreeVision Canopy Trim Pre-Estimator
# Supabase CLI v1 project configuration
# Reference: https://supabase.com/docs/guides/cli/config

[project]
id = "hydlxwjtdkzcnxxukakt"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[[storage.buckets]]
name = "tree-photos"
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/heic"]

[auth]
enabled = true
site_url = "https://tree-vision-ai.vercel.app"
additional_redirect_urls = ["http://localhost:8097", "http://127.0.0.1:8097"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

# ─── Edge Functions ───────────────────────────────────────────────────────────
# Deployed via: supabase functions deploy <name>
# Secrets set via: supabase secrets set KEY=value
#
# Required secrets:
#   OPENAI_API_KEY        — for the analyze function (GPT-4o vision)
#   RESEND_API_KEY        — for the send-quote function (transactional email)
#   QUOTE_FROM_EMAIL      — verified sender address in your Resend account
#   COMPANY_NAME          — your company name used in email templates
#
# SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are injected automatically.

[functions.analyze]
verify_jwt = false
import_map = "./functions/analyze/deno.json"

[functions.save-estimate]
verify_jwt = false
import_map = "./functions/save-estimate/deno.json"

[functions.send-quote]
verify_jwt = false
import_map = "./functions/send-quote/deno.json"
