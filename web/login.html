<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Tree Service - Login</title>
  <meta name="theme-color" content="#052e16">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Spline Sans',system-ui,sans-serif;background:#f0fdf4;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;border:1px solid #d1fae5;border-radius:12px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(5,46,22,.08)}
    .brand{display:flex;align-items:center;gap:.5rem;font-weight:800;color:#052e16;margin-bottom:1.5rem;font-size:1.1rem}
    h1{font-size:1.4rem;font-weight:800;color:#052e16;margin-bottom:.25rem}
    p.sub{color:#6b7280;font-size:.875rem;margin-bottom:1.5rem}
    label{display:block;font-size:.875rem;font-weight:600;color:#374151;margin-bottom:.3rem}
    input{width:100%;padding:.6rem .75rem;border:1px solid #d1d5db;border-radius:6px;font-size:.95rem;margin-bottom:1rem;outline:none;transition:border-color .2s}
    input:focus{border-color:#16a34a}
    .btn{width:100%;padding:.7rem;background:#16a34a;color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer}
    .btn:hover{background:#15803d}
    .btn:disabled{background:#86efac;cursor:not-allowed}
    #err{color:#dc2626;font-size:.85rem;margin-top:.75rem;display:none}
  </style>
</head>
<body>
<div class="card">
  <div class="brand">🌳 Dynamic Tree Service</div>
  <h1>Manager Login</h1>
  <p class="sub">Sign in to access the company portal.</p>
  <form id="f" novalidate>
    <label>Email</label>
    <input type="email" id="em" placeholder="you@example.com" autocomplete="email" required>
    <label>Password</label>
    <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password" required>
    <button type="submit" class="btn" id="btn">Sign In</button>
    <div id="err"></div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SB_URL = "https://hydlxwjtdkzcnxxukakt.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5ZGx4d2p0ZGt6Y254eHVrYWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODcyNjQsImV4cCI6MjA5NTI2MzI2NH0.vXLOWjXh_6z8sSoBVqKA6wwwEKKMozjhRoIIUffwnzI";

  const err = document.getElementById("err");
  function showErr(msg) { err.textContent = msg; err.style.display = "block"; }

  function purgeSupabaseStorage() {
    try {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (k && (k.startsWith("sb-") || k.startsWith("supabase."))) localStorage.removeItem(k);
      }
      for (let i = sessionStorage.length - 1; i >= 0; i--) {
        const k = sessionStorage.key(i);
        if (k && (k.startsWith("sb-") || k.startsWith("supabase."))) sessionStorage.removeItem(k);
      }
    } catch (_) {}
  }

  const urlErr = new URLSearchParams(location.search).get("error");
  if (urlErr) {
    if (/ByteString|character at index|greater than 255/i.test(urlErr)) {
      purgeSupabaseStorage();
      showErr("Your previous session was corrupted and has been cleared. Please sign in again.");
    } else {
      showErr(urlErr);
    }
    history.replaceState({}, "", location.pathname);
  }

  let sb;
  try { sb = supabase.createClient(SB_URL, SB_KEY); }
  catch (_) { purgeSupabaseStorage(); sb = supabase.createClient(SB_URL, SB_KEY); }

  (async () => {
    try {
      const { data } = await sb.auth.getSession();
      if (data && data.session) window.location.replace("portal.html");
    } catch (_) { purgeSupabaseStorage(); }
  })();

  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("btn");
    err.style.display = "none"; btn.disabled = true; btn.textContent = "Signing in…";
    try {
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById("em").value.trim(),
        password: document.getElementById("pw").value
      });
      if (error) {
        showErr(error.message || "Login failed.");
        btn.disabled = false; btn.textContent = "Sign In";
      } else {
        window.location.replace("portal.html");
      }
    } catch (_) {
      purgeSupabaseStorage();
      showErr("Sign-in failed due to a stored session error. Please try again.");
      btn.disabled = false; btn.textContent = "Sign In";
    }
  });
</script>
</body>
</html>
