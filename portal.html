<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signing you in…</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #052e16; color: #d7f3e1;
    font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .box { text-align: center; }
  .spin {
    width: 34px; height: 34px; margin: 0 auto 14px;
    border: 3px solid rgba(255,255,255,.2); border-top-color: #5EEAD4;
    border-radius: 50%; animation: s .8s linear infinite;
  }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <div>Signing you in…</div>
  </div>
  <!--
    The login page (login.html) redirects here after a successful Supabase sign-in.
    This page simply forwards to the back-office dashboard, where app.js confirms
    the session and grants access.
  -->
  <script>
    window.location.replace('/dashboard');
  </script>
</body>
</html>
