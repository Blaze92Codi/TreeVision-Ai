<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Tree Service - Login</title>
  <meta name="theme-color" content="#052e16">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0fdf4;
    }
    .login-card {
      background: #fff;
      border: 1px solid #d1fae5;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(5,46,22,.08);
    }
    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #052e16;
      margin: 0 0 .25rem;
    }
    .login-card p.sub {
      color: #6b7280;
      font-size: .875rem;
      margin: 0 0 1.5rem;
    }
    .login-card label {
      display: block;
      font-size: .875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: .3rem;
    }
    .login-card input[type="email"],
    .login-card input[type="password"] {
      width: 100%;
      padding: .6rem .75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: .95rem;
      margin-bottom: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color .2s;
    }
    .login-card input:focus {
      border-color: #16a34a;
    }
    .login-btn {
      width: 100%;
      padding: .7rem;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    .login-btn:hover { background: #15803d; }
    .login-btn:disabled { background: #86efac; cursor: not-allowed; }
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: .9rem;
      font-size: .85rem;
      color: #16a34a;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
    }
    .forgot-link:hover { text-decoration: underline; }
    #loginError {
      color: #dc2626;
      font-size: .85rem;
      margin-top: .75rem;
      display: none;
    }
    #loginInfo {
      color: #15803d;
      font-size: .85rem;
      margin-top: .75rem;
      display: none;
    }
    .brand-top {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 1.5rem;
      font-weight: 800;
      color: #052e16;
      font-size: 1.1rem;
    }
    .brand-top svg { width: 28px; height: 28px; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand-top">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="16" fill="#052e16"/>
        <path d="M16 6 C10 6 7 11 9 15 C7 15 6 17 8 18 L24 18 C26 17 25 15 23 15 C25 11 22 6 16 6Z" fill="#4ade80"/>
        <rect x="15" y="18" width="2" height="8" rx="1" fill="#86efac"/>
      </svg>
      Dynamic Tree Service
    </div>
    <h1>Manager Login</h1>
    <p class="sub">Sign in to access the company portal.</p>
    <form id="loginForm" novalidate>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
      <button type="button" class="forgot-link" id="forgotBtn">Forgot password?</button>
      <div id="loginError"></div>
      <div id="loginInfo"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://hydlxwjtdkzcnxxukakt.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5ZGx4d2p0ZGt6Y254eHVrYWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODcyNjQsImV4cCI6MjA5NTI2MzI2NH0.vXLOWjXh_6z8sSoBVqKA6wwwEKKMozjhRoIIUffwnzI";

  const form    = document.getElementById("loginForm");
  const btn     = document.getElementById("loginBtn");
  const errEl   = document.getElementById("loginError");
  const infoEl  = document.getElementById("loginInfo");
  const forgot  = document.getElementById("forgotBtn");

  function showErr(msg) {
    infoEl.style.display = "none";
    errEl.textContent = msg;
    errEl.style.display = "block";
  }
  function showInfo(msg) {
    errEl.style.display = "none";
    infoEl.textContent = msg;
    infoEl.style.display = "block";
  }

  // If we arrived here from a password recovery email, supabase puts a
  // `type=recovery` token in the URL hash. Hand the user off to the account
  // page so they can set a new password instead of bouncing into the portal.
  const _h = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (_h.get("type") === "recovery") {
    location.replace("account.html" + location.hash);
  }

  // Surface any error passed in the URL (e.g. from a failed auth redirect).
  const urlErr = new URLSearchParams(location.search).get("error");
  if (urlErr) {
    if (/ByteString|character at index|greater than 255/i.test(urlErr)) {
      // Stale session in localStorage contains a non-Latin1 char (e.g. em dash
      // in user_metadata) that supabase-js can't base64-encode. Purge it.
      purgeSupabaseStorage();
      showErr("Your previous session was corrupted and has been cleared. Please sign in again.");
    } else {
      showErr(urlErr);
    }
    history.replaceState({}, "", location.pathname);
  }

  function purgeSupabaseStorage() {
    try {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (k && (k.startsWith("sb-") || k.startsWith("supabase."))) localStorage.removeItem(k);
      }
      for (let i = sessionStorage.length - 1; i >= 0; i--) {
        const k = sessionStorage.key(i);
        if (k && (k.startsWith("sb-") || k.startsWith("supabase."))) sessionStorage.removeItem(k);
      }
    } catch (_) { /* ignore */ }
  }

  let sb;
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (e) {
    purgeSupabaseStorage();
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  // If already logged in, go straight to portal. Guard against corrupted
  // localStorage payloads that make supabase-js throw on read.
  (async () => {
    try {
      const { data } = await sb.auth.getSession();
      if (data && data.session) window.location.replace("portal.html");
    } catch (e) {
      purgeSupabaseStorage();
    }
  })();

  forgot.addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value.trim();
    if (!email) { showErr("Enter your email above, then click Forgot password."); return; }
    forgot.disabled = true;
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + "/account.html"
      });
      if (error) showErr(error.message || "Could not send reset email.");
      else showInfo("Password reset email sent. Check your inbox.");
    } catch (_) {
      purgeSupabaseStorage();
      showErr("Could not send reset email. Please try again.");
    } finally {
      forgot.disabled = false;
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email    = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    errEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Signing in…";

    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        showErr(error.message || "Login failed. Check your credentials.");
        btn.disabled = false;
        btn.textContent = "Sign In";
      } else {
        window.location.replace("portal.html");
      }
    } catch (e) {
      // Most common cause here: supabase-js btoa() fails on a session payload
      // containing characters > 255. Clear and ask the user to retry.
      purgeSupabaseStorage();
      showErr("Sign-in failed due to a stored session error. Please try again.");
      btn.disabled = false;
      btn.textContent = "Sign In";
    }
  });
</script>
</body>
</html>
