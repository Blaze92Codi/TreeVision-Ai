<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Tree Service — Dashboard</title>
<meta name="theme-color" content="#052e16">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<nav class="site-nav">
  <a href="./" class="site-brand">Dynamic Tree Service</a>
  <ul>
    <li><a data-nav="index.html" href="./">Client</a></li>
    <li><a data-nav="dashboard.html" href="dashboard.html">Dashboard</a></li>
    <li><a data-nav="schedule.html" href="schedule.html">Schedule</a></li>
    <li><a data-nav="crew.html" href="crew.html">Crew</a></li>
    <li><a data-nav="account.html" href="account.html">Account</a></li>
    <li><a data-nav="login.html" href="login.html">Login</a></li>
  </ul>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

<div class="topbar">
  <div>
    <div class="topbar-logo">🌳 TreeVision — Manager Review</div>
    <div class="topbar-sub">Dynamic Tree Service · Internal use only</div>
  </div>
  <div class="topbar-spacer"></div>
  <span id="last-refresh" style="font-size:.75rem;color:rgba(255,255,255,.5);margin-right:10px;"></span>
  <button class="topbar-refresh" onclick="loadEstimates()">↻ Refresh</button>
</div>

<!-- Photo lightbox (openPhoto/Escape target) -->
<div id="photo-lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out;" onclick="this.style.display='none'">
  <img id="lightbox-img" alt="Tree photo" style="max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.6);">
</div>

<div class="shell">
  <!-- Stats -->
  <div class="stats-strip">
    <div class="stat pending">
      <div class="stat-num" id="stat-pending">–</div>
      <div class="stat-lbl">Pending review</div>
    </div>
    <div class="stat approved">
      <div class="stat-num" id="stat-approved">–</div>
      <div class="stat-lbl">Approved</div>
    </div>
    <div class="stat rejected">
      <div class="stat-num" id="stat-rejected">–</div>
      <div class="stat-lbl">Rejected</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-total">–</div>
      <div class="stat-lbl">Total leads</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="pending"  onclick="setFilter('pending')">Pending</button>
    <button class="filter-btn"        data-filter="approved" onclick="setFilter('approved')">Approved</button>
    <button class="filter-btn"        data-filter="scheduled" onclick="setFilter('scheduled')">Scheduled</button>
    <button class="filter-btn"        data-filter="rejected" onclick="setFilter('rejected')">Rejected</button>
    <button class="filter-btn"        data-filter="all"      onclick="setFilter('all')">All</button>
    <div class="filter-spacer"></div>
    <span class="loading-msg" id="loading-msg"></span>
  </div>

  <!-- Estimates list -->
  <div class="estimate-list" id="estimate-list">
    <div class="empty"><div class="empty-icon">🌳</div><h3>Loading estimates…</h3></div>
  </div>
</div>


<script>
let allEstimates = [];
let currentFilter = 'pending';

/* ── Load ── */
async function loadEstimates() {
  document.getElementById('loading-msg').textContent = 'Loading…';
  const { data, error } = await db.from('estimates')
      .select('*')
      .not('client_name', 'is', null).order('created_at', { ascending: false });
  if (error) { document.getElementById('loading-msg').textContent = 'Error: ' + error.message; return; }
  allEstimates = data || [];
  document.getElementById('loading-msg').textContent = '';
  document.getElementById('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
  updateStats();
  render();
}

function updateStats() {
  document.getElementById('stat-pending').textContent  = allEstimates.filter(e => (e.status === 'draft' || e.status === 'sent')).length;
  document.getElementById('stat-approved').textContent = allEstimates.filter(e => e.status === 'approved').length;
  document.getElementById('stat-rejected').textContent = allEstimates.filter(e => (e.status === 'declined' || e.status === 'expired')).length;
  document.getElementById('stat-total').textContent    = allEstimates.length;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  render();
}

// Filter UI labels ↔ DB status values. The DB uses draft/sent for
// records awaiting review and declined/expired for rejected.
const FILTER_STATUSES = {
  pending:   ['draft', 'sent'],
  approved:  ['approved'],
  scheduled: ['scheduled'],
  rejected:  ['declined', 'expired'],
};

function render() {
  const allowed = FILTER_STATUSES[currentFilter];
  const list = currentFilter === 'all'
    ? allEstimates
    : allEstimates.filter(e => allowed ? allowed.includes(e.status) : e.status === currentFilter);
  const el = document.getElementById('estimate-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><h3>No ${currentFilter === 'all' ? '' : currentFilter} estimates</h3><p>They'll appear here when submitted via the field app.</p></div>`;
    return;
  }
  el.innerHTML = list.map(e => renderCard(e)).join('');
}

/* ── Card ── */
function renderCard(e) {
  const ago = timeAgo(e.created_at);
  const condClass = { Excellent:'good', Good:'good', Fair:'fair', Poor:'poor', 'Dead/Hazardous':'dead' }[(e.health_summary || '')] || 'fair';
  const riskClass  = { Low:'low', Moderate:'moderate', High:'high', Extreme:'poor' }[(Array.isArray(e.hazard_flags) ? e.hazard_flags.join(', ') : (e.hazard_flags || ''))] || 'moderate';

  const contactHtml = (e.client_name || (e.customer_phone || '') || e.client_address) ? `
    <div class="contact-block">
      ${e.client_name    ? `<div class="contact-row"><span class="icon">👤</span><span>${esc(e.client_name)}</span></div>` : ''}
      ${(e.customer_phone || '')   ? `<div class="contact-row"><span class="icon">📞</span><a href="tel:${esc((e.customer_phone || ''))}">${esc((e.customer_phone || ''))}</a></div>` : ''}
      ${e.client_email   ? `<div class="contact-row"><span class="icon">✉️</span><a href="mailto:${esc(e.client_email)}">${esc(e.client_email)}</a></div>` : ''}
      ${(e.client_address || '')      ? `<div class="contact-row"><span class="icon">📍</span><span>${esc((e.client_address || ''))}</span></div>` : ''}
    </div>` : '<div class="no-contact">No contact info saved</div>';

  const notesHtml = ((e.health_summary ? [e.health_summary] : []) || []).length ? `<ul class="notes-items">${((e.health_summary ? [e.health_summary] : [])||[]).map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '<div class="no-contact">No observations</div>';

  const internalHtml = (e.scope_description || '') ? `<div class="internal-note-box"><strong>🔒 Estimator notes</strong>${esc((e.scope_description || ''))}</div>` : '<div class="no-contact">No internal notes</div>';

  const footerHtml = (e.status === 'draft' || e.status === 'sent') ? `
    <div class="est-footer">
      <div class="review-form">
        <div>
          <div class="review-label">Manager notes (visible to customer if shared)</div>
          <textarea class="review-textarea" id="mnotes-${e.id}" rows="2" placeholder="Add scope clarifications, conditions, or next steps…"></textarea>
        </div>
        <div class="review-row">
          <div>
            <div class="review-label">Approved quote low ($)</div>
            <input class="review-input" type="number" id="qlo-${e.id}" value="${(e.price_range_low || 0)||''}" style="width:120px;">
          </div>
          <div>
            <div class="review-label">Approved quote high ($)</div>
            <input class="review-input" type="number" id="qhi-${e.id}" value="${(e.price_range_high || 0)||''}" style="width:120px;">
          </div>
        </div>
        <div class="review-actions">
          <button class="btn-approve"  onclick="updateEstimate('${e.id}','approved')">✓ Approve &amp; confirm quote</button>
          <button class="btn-schedule" onclick="updateEstimate('${e.id}','scheduled')">📅 Mark as scheduled</button>
          <button class="btn-reject"   onclick="updateEstimate('${e.id}','declined')">✕ Reject</button>
        </div>
      </div>
    </div>` : e.status !== 'pending' ? `
    <div class="est-footer">
      <div class="approved-summary">
        <div><div class="lbl">Decision</div><div class="val">${e.status.charAt(0).toUpperCase() + e.status.slice(1)}</div></div>
        ${(e.price_range_low || 0) ? `<div><div class="lbl">Approved quote</div><div class="val">$${num((e.price_range_low || 0))} – $${num((e.price_range_high || 0))}</div></div>` : ''}
        ${e.approved_at ? `<div><div class="lbl">Decided</div><div class="val">${timeAgo(e.approved_at)}</div></div>` : ''}
        ${e.quote_sent_at ? `<div><div class="lbl">Quote sent</div><div class="val">${timeAgo(e.quote_sent_at)}</div></div>` : ''}
        ${e.manager_notes ? `<div style="width:100%;"><div class="lbl">Manager notes</div><div style="font-size:.85rem;margin-top:2px;">${esc(e.manager_notes)}</div></div>` : ''}
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${e.client_email
            ? e.quote_sent_at
              ? `<span class="sent-badge">✓ Quote sent ${timeAgo(e.quote_sent_at)}</span>
                 <button class="btn-send" style="font-size:.8rem;padding:7px 14px;" onclick="sendQuote('${e.id}',this)">↺ Resend</button>`
              : `<button class="btn-send" onclick="sendQuote('${e.id}',this)">✉ Send quote to customer</button>`
            : `<span style="font-size:.78rem;color:var(--muted);">No email — can't send</span>`
          }
          <button class="btn-approve" style="background:transparent;color:var(--muted);border:1px solid var(--line);font-size:.78rem;padding:7px 12px;" onclick="resetToPending('${e.id}')">↩ Reset</button>
        </div>
      </div>
    </div>` : '';

  return `
  <div class="est-card ${e.status}" id="card-${e.id}">
    <div class="est-header">
      ${(e.photo_urls && e.photo_urls[0] || "")
        ? `<img class="est-photo" src="${esc((e.photo_urls && e.photo_urls[0] || ""))}" alt="Tree photo" onclick="openPhoto('${esc((e.photo_urls && e.photo_urls[0] || ""))}')" title="Click to view full photo">`
        : `<div class="est-photo-placeholder"><i class="ti ti-photo-off" aria-hidden="true"></i></div>`
      }
      <div class="est-meta">
        <div class="est-id">#${e.id.substring(0,8).toUpperCase()}</div>
        <div class="est-species">${esc((e.tree_species || '') || 'Unknown tree')}</div>
        <div class="est-latin">${esc('' || '')}</div>
      </div>
      <div class="est-right">
        <div class="est-time">${ago}</div>
        <span class="status-pill pill-${e.status}">${e.status}</span>
      </div>
    </div>
    <div class="est-body">
      <div class="est-section">
        <h4>Assessment</h4>
        <div class="fact-row"><span class="fact-key">Condition</span><span class="fact-val"><span class="badge-sm badge-${condClass}">${esc((e.health_summary || '')||'—')}</span></span></div>
        <div class="fact-row"><span class="fact-key">ISA risk</span><span class="fact-val"><span class="badge-sm badge-${riskClass}">${esc((Array.isArray(e.hazard_flags) ? e.hazard_flags.join(', ') : (e.hazard_flags || ''))||'—')}</span></span></div>
        <div class="fact-row"><span class="fact-key">Height</span><span class="fact-val">${esc((e.estimated_height_ft ? e.estimated_height_ft + ' ft' : '')||'—')}</span></div>
        <div class="fact-row"><span class="fact-key">DBH</span><span class="fact-val">${esc(''||'—')}</span></div>
        <div class="fact-row"><span class="fact-key">Crown</span><span class="fact-val">${esc((e.crown_diameter_ft ? e.crown_diameter_ft + ' ft' : '')||'—')}</span></div>
        <div class="quote-block">
          <div class="lbl">AI estimate</div>
          <div class="amt">${(e.price_range_low || 0) ? '$' + num((e.price_range_low || 0)) + ' – $' + num((e.price_range_high || 0)) : '—'}</div>
          <div class="svc">${esc((e.scope_description || '') || (Array.isArray(e.recommended_services) ? e.recommended_services.join(', ') : (e.recommended_services || '')) || '—')}</div>
        </div>
      </div>
      <div class="est-section">
        <h4>AI observations</h4>
        ${notesHtml}
        <div style="margin-top:12px;">
          ${internalHtml}
        </div>
      </div>
      <div class="est-section">
        <h4>Customer contact</h4>
        ${contactHtml}
      </div>
    </div>
    ${footerHtml}
  </div>`;
}

/* ── Update estimate ── */
async function updateEstimate(id, status) {
  const notes  = document.getElementById('mnotes-' + id)?.value || '';
  const qLo    = parseInt(document.getElementById('qlo-' + id)?.value) || null;
  const qHi    = parseInt(document.getElementById('qhi-' + id)?.value) || null;
  const { error } = await db.from('estimates').update({
    status,
    manager_notes:      notes,
    approved_quote_low:  qLo,
    approved_quote_high: qHi,
    approved_at:        new Date().toISOString(),
  }).eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  await loadEstimates();
}

async function sendQuoteEmail(estimateId, approvedBy) {
  const url = (typeof CONFIG !== 'undefined' && CONFIG.SUPABASE_URL)
    ? CONFIG.SUPABASE_URL + '/functions/v1/send-quote'
    : SUPABASE_URL + '/functions/v1/send-quote';
  const key = (typeof CONFIG !== 'undefined' && CONFIG.SUPABASE_KEY) || SUPABASE_ANON;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
    body: JSON.stringify({ estimate_id: estimateId, approvedBy }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

async function sendQuote(id, el) {
  const btn = el || event?.target;
  const orig = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  try {
    await sendQuoteEmail(id, 'Manager');
    await loadEstimates();
  } catch (err) {
    alert('Could not send quote: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}

async function resetToPending(id) {
  await db.from('estimates').update({ status: 'draft', approved_at: null, manager_notes: null }).eq('id', id);
  await loadEstimates();
}

/* ── Helpers ── */
function openPhoto(url) {
  const lb = document.getElementById('photo-lightbox');
  document.getElementById('lightbox-img').src = url;
  lb.style.display = 'flex';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const lb = document.getElementById('photo-lightbox'); if (lb) lb.style.display = 'none'; } });

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function num(n) { return Number(n).toLocaleString('en-US'); }
function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60)   return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

loadEstimates();
setInterval(loadEstimates, 60000);
</script>

</body>
</html>
