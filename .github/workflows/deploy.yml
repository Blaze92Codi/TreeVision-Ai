name: Deploy Worker

# Single-app deploy: push to `main` → production (treevision).
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Type-check
        working-directory: worker
        run: npx tsc --noEmit

      - name: Apply pending D1 migrations
        working-directory: worker
        run: |
          CREATE_OUT=$(npx wrangler d1 create treevision 2>&1)
          DB=$(echo "$CREATE_OUT" | grep -o 'database_id = "[a-f0-9-]*"' | grep -o '[a-f0-9-]\{36\}' || echo "")
          [ -z "$DB" ] && DB=$(npx wrangler d1 list --json 2>&1 | grep -o '"uuid":"[a-f0-9-]*"' | grep -o '[a-f0-9-]\{36\}' | head -1)
          [ -n "$DB" ] && sed -i "s/database_id = \"[^\"]*\"/database_id = \"$DB\"/" wrangler.toml
          npx wrangler d1 migrations apply treevision --remote

      - name: Deploy Worker + static assets
        working-directory: worker
        run: npx wrangler deploy

      - name: Summary
        if: success()
        run: |
          echo "### ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
