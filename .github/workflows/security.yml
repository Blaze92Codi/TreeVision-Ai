name: Security regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test local database permissions and browser safety
        working-directory: tests
        run: npm ci --ignore-scripts && npm test
      - name: Check and test Edge Functions without production access
        run: |
          ln -s tests/node_modules node_modules
          deno check --node-modules-dir=manual supabase/functions/{analyze,save-estimate,send-quote}/index.ts
          deno test --node-modules-dir=manual tests/edge.test.ts
      - name: Check and test Worker access boundaries
        working-directory: worker
        run: npm ci && npx tsc --noEmit && npx tsx --test ../tests/worker.test.ts
