<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TreeVision — Manager Review Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --em:          #16a34a;
  --em-bright:   #22c55e;
  --em-glow:     #4ade80;
  --em-dark:     #052e16;
  --em-hero:     #020d06;
  --em-rich:     #15803d;
  --em-soft:     #f0fdf4;
  --em-light:    #dcfce7;
  --em-mid:      #86efac;
  --ink:         #0f172a;
  --ink2:        #1e293b;
  --muted:       #64748b;
  --subtle:      #94a3b8;
  --line:        #e2e8f0;
  --line2:       #f1f5f9;
  --bg:          #f8fafc;
  --card:        #ffffff;
  --surface:     #f1f5f9;
  --amber:       #d97706;
  --amber-light: #fef3c7;
  --amber-border:#fcd34d;
  --amber-text:  #92400e;
  --danger:      #dc2626;
  --danger-bg:   #fef2f2;
  --warn:        #b45309;
  --warn-bg:     #fffbeb;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Spline Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }

/* ── Shell ── */
.shell { max-width: 1100px; margin: 0 auto; padding: 0 24px 64px; }
.topbar {
  background: var(--em-dark); padding: 16px 24px; margin-bottom: 32px;
  display: flex; align-items: center; gap: 16px;
}
.topbar-logo { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 1.25rem; color: #fff; letter-spacing: -.02em; }
.topbar-sub  { font-size: .8rem; color: rgba(255,255,255,.6); margin-top: 1px; }
.topbar-spacer { flex: 1; }
.topbar-refresh {
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
  color: #fff; font-size: .82rem; font-weight: 600; padding: 7px 14px;
  border-radius: var(--r-sm); cursor: pointer; transition: background .15s;
}
.topbar-refresh:hover { background: rgba(255,255,255,.22); }

/* ── Stats strip ── */
.stats-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; }
.stat-num { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 2rem; letter-spacing: -.03em; }
.stat-lbl { font-size: .78rem; color: var(--muted); font-weight: 500; margin-top: 3px; }
.stat.pending  .stat-num { color: var(--amber); }
.stat.approved .stat-num { color: var(--em-rich); }
.stat.rejected .stat-num { color: var(--danger); }

/* ── Filter bar ── */
.filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.filter-btn {
  padding: 7px 16px; border-radius: var(--r-full);
  border: 1.5px solid var(--line); background: var(--card);
  font-family: inherit; font-size: .85rem; font-weight: 600; color: var(--muted);
  cursor: pointer; transition: all .15s;
}
.filter-btn.active { background: var(--em-dark); border-color: var(--em-dark); color: #fff; }
.filter-btn:hover:not(.active) { border-color: var(--em); color: var(--em-rich); }
.filter-spacer { flex: 1; }
.loading-msg { color: var(--muted); font-size: .88rem; }

/* ── Empty state ── */
.empty { text-align: center; padding: 60px 24px; color: var(--muted); }
.empty-icon { font-size: 3rem; margin-bottom: 12px; }
.empty h3 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; margin-bottom: 6px; color: var(--ink); }

/* ── Estimate cards ── */
.estimate-list { display: flex; flex-direction: column; gap: 16px; }
.est-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: var(--r-lg); overflow: hidden;
  transition: box-shadow .2s;
}
.est-card:hover { box-shadow: 0 4px 20px rgba(13,74,40,.09); }
.est-card.pending  { border-left: 4px solid var(--amber-border); }
.est-card.approved { border-left: 4px solid var(--em); }
.est-card.rejected { border-left: 4px solid var(--danger); }
.est-card.scheduled { border-left: 4px solid #3b82f6; }

.est-header {
  display: flex; align-items: flex-start; gap: 16px;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.est-photo { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; flex-shrink: 0; cursor: pointer; border: 2px solid var(--line); transition: border-color .15s; }
.est-photo:hover { border-color: var(--em); }
.est-photo-placeholder { width: 80px; height: 80px; border-radius: 10px; background: var(--surface); border: 2px dashed var(--line); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--subtle); font-size: 1.5rem; }
.est-id { font-size: .7rem; color: var(--muted); font-family: monospace; margin-bottom: 6px; }
.est-species { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 1.25rem; letter-spacing: -.02em; }
.est-latin  { font-style: italic; color: var(--muted); font-size: .82rem; }
.est-meta { flex: 1; }
.est-right { text-align: right; flex-shrink: 0; }
.est-time { font-size: .75rem; color: var(--muted); margin-bottom: 6px; }
.status-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: var(--r-full);
  font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
}
.pill-pending  { background: var(--amber-light); color: var(--amber-text); border: 1px solid var(--amber-border); }
.pill-approved { background: var(--em-soft);     color: var(--em-rich);    border: 1px solid var(--em-light); }
.pill-rejected { background: var(--danger-bg);   color: var(--danger);     border: 1px solid rgba(220,38,38,.2); }
.pill-scheduled { background: #eff6ff;           color: #1d4ed8;           border: 1px solid #bfdbfe; }

.est-body { padding: 16px 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
@media (max-width: 700px) { .est-body { grid-template-columns: 1fr; } }

.est-section h4 { font-size: .72rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }

.fact-row { display: flex; justify-content: space-between; font-size: .85rem; padding: 4px 0; border-bottom: 1px solid var(--line); }
.fact-row:last-child { border-bottom: none; }
.fact-key { color: var(--muted); }
.fact-val { font-weight: 600; }

.badge-sm { display: inline-block; padding: 2px 8px; border-radius: var(--r-full); font-size: .72rem; font-weight: 700; }
.badge-fair    { background: var(--warn-bg);    color: var(--warn); }
.badge-good    { background: var(--em-soft); color: var(--em-rich); }
.badge-poor    { background: var(--danger-bg);  color: var(--danger); }
.badge-dead    { background: var(--surface);    color: var(--muted); }
.badge-moderate { background: var(--warn-bg);   color: var(--warn); }
.badge-high    { background: var(--danger-bg);  color: var(--danger); }
.badge-low     { background: var(--em-soft); color: var(--em-rich); }

.notes-items { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.notes-items li { font-size: .82rem; color: var(--ink); display: flex; gap: 7px; line-height: 1.4; }
.notes-items li::before { content: "▸"; color: var(--em); font-weight: 700; flex-shrink: 0; }

.internal-note-box {
  background: var(--amber-light); border: 1px solid var(--amber-border);
  border-radius: var(--r-sm); padding: 10px 12px; font-size: .82rem;
  color: var(--amber-text); line-height: 1.5;
}
.internal-note-box strong { display: block; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 4px; }

/* ── Quote block ── */
.quote-block {
  background: var(--em-dark); color: #fff;
  border-radius: var(--r-sm); padding: 14px 16px; margin-top: 6px;
}
.quote-block .lbl { font-size: .72rem; opacity: .7; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.quote-block .amt { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 1.5rem; letter-spacing: -.02em; margin: 2px 0; }
.quote-block .svc { font-size: .8rem; opacity: .8; }

/* ── Review panel ── */
.est-footer { border-top: 1px solid var(--line); padding: 16px 20px; background: var(--bg); }
.review-form { display: flex; flex-direction: column; gap: 12px; }
.review-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.review-label { font-size: .78rem; font-weight: 600; color: var(--ink); display: block; margin-bottom: 4px; }
.review-input {
  border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 9px 12px;
  font-family: inherit; font-size: .9rem; color: var(--ink); background: var(--card); outline: none;
  transition: border-color .15s;
}
.review-input:focus { border-color: var(--em); }
.review-textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: var(--r-sm);
  padding: 9px 12px; font-family: inherit; font-size: .88rem;
  color: var(--ink); background: var(--card); resize: vertical; outline: none;
  transition: border-color .15s;
}
.review-textarea:focus { border-color: var(--em); }
.review-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-approve {
  padding: 10px 20px; background: var(--em); color: #fff;
  font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: .92rem;
  border-radius: var(--r-sm); border: none; cursor: pointer; transition: background .15s;
}
.btn-approve:hover { background: var(--em-rich); }
.btn-reject {
  padding: 10px 20px; background: var(--danger-bg); color: var(--danger);
  font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: .92rem;
  border-radius: var(--r-sm); border: 1.5px solid #f5c4c4; cursor: pointer; transition: background .15s;
}
.btn-reject:hover { background: #fbd0ce; }
.btn-schedule {
  padding: 10px 20px; background: #eff6ff; color: #1d4ed8;
  font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: .92rem;
  border-radius: var(--r-sm); border: 1.5px solid #bfdbfe; cursor: pointer; transition: background .15s;
}
.btn-schedule:hover { background: #dbeafe; }
.btn-send {
  padding: 10px 20px; background: var(--em); color: #fff;
  font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: .92rem;
  border-radius: var(--r-sm); border: none; cursor: pointer; transition: all .15s;
  box-shadow: 0 1px 3px rgba(22,163,74,.3);
}
.btn-send:hover { background: var(--em-rich); }
.btn-send:disabled { opacity: .5; cursor: default; }
.sent-badge { display:inline-flex; align-items:center; gap:6px; background:var(--em-soft); color:var(--em-rich); border:1px solid var(--em-light); border-radius:var(--r-full); padding:5px 12px; font-size:.8rem; font-weight:700; }

.approved-summary {
  background: var(--em-soft); border: 1px solid var(--em-mid);
  border-radius: var(--r-sm); padding: 12px 14px;
  display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
}
.approved-summary .lbl { font-size: .75rem; color: var(--muted); font-weight: 500; }
.approved-summary .val { font-weight: 700; color: var(--em-rich); font-size: .92rem; }

/* Contact block */
.contact-block { display: flex; flex-direction: column; gap: 6px; }
.contact-row { display: flex; align-items: center; gap: 8px; font-size: .85rem; }
.contact-row .icon { font-size: 1rem; flex-shrink: 0; }
.contact-row a { color: var(--em-rich); font-weight: 600; text-decoration: none; }
.contact-row a:hover { text-decoration: underline; }
.no-contact { font-size: .82rem; color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-logo">🌳 TreeVision — Manager Review</div>
    <div class="topbar-sub">Dynamic Tree Service · Internal use only</div>
  </div>
  <div class="topbar-spacer"></div>
  <span id="last-refresh" style="font-size:.75rem;color:rgba(255,255,255,.5);margin-right:10px;"></span>
  <button class="topbar-refresh" onclick="loadEstimates()">↻ Refresh</button>
</div>

<div class="shell">
  <!-- Stats -->
  <div class="stats-strip">
    <div class="stat pending">
      <div class="stat-num" id="stat-pending">–</div>
      <div class="stat-lbl">Pending review</div>
    </div>
    <div class="stat approved">
      <div class="stat-num" id="stat-approved">–</div>
      <div class="stat-lbl">Approved</div>
    </div>
    <div class="stat rejected">
      <div class="stat-num" id="stat-rejected">–</div>
      <div class="stat-lbl">Rejected</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-total">–</div>
      <div class="stat-lbl">Total leads</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="pending"  onclick="setFilter('pending')">Pending</button>
    <button class="filter-btn"        data-filter="approved" onclick="setFilter('approved')">Approved</button>
    <button class="filter-btn"        data-filter="scheduled" onclick="setFilter('scheduled')">Scheduled</button>
    <button class="filter-btn"        data-filter="rejected" onclick="setFilter('rejected')">Rejected</button>
    <button class="filter-btn"        data-filter="all"      onclick="setFilter('all')">All</button>
    <div class="filter-spacer"></div>
    <span class="loading-msg" id="loading-msg"></span>
  </div>

  <!-- Estimates list -->
  <div class="estimate-list" id="estimate-list">
    <div class="empty"><div class="empty-icon">🌳</div><h3>Loading estimates…</h3></div>
  </div>
</div>

<script>
const SUPABASE_URL  = 'https://hydlxwjtdkzcnxxukakt.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5ZGx4d2p0ZGt6Y254eHVrYWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODcyNjQsImV4cCI6MjA5NTI2MzI2NH0.vXLOWjXh_6z8sSoBVqKA6wwwEKKMozjhRoIIUffwnzI';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let allEstimates = [];
let currentFilter = 'pending';

/* ── Load ── */
async function loadEstimates() {
  document.getElementById('loading-msg').textContent = 'Loading…';
  const { data, error } = await db.from('estimates').select('*').order('created_at', { ascending: false });
  if (error) { document.getElementById('loading-msg').textContent = 'Error: ' + error.message; return; }
  allEstimates = data || [];
  document.getElementById('loading-msg').textContent = '';
  document.getElementById('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
  updateStats();
  render();
}

function updateStats() {
  document.getElementById('stat-pending').textContent  = allEstimates.filter(e => e.status === 'pending').length;
  document.getElementById('stat-approved').textContent = allEstimates.filter(e => e.status === 'approved').length;
  document.getElementById('stat-rejected').textContent = allEstimates.filter(e => e.status === 'rejected').length;
  document.getElementById('stat-total').textContent    = allEstimates.length;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  render();
}

function render() {
  const list = currentFilter === 'all' ? allEstimates : allEstimates.filter(e => e.status === currentFilter);
  const el = document.getElementById('estimate-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><h3>No ${currentFilter === 'all' ? '' : currentFilter} estimates</h3><p>They'll appear here when submitted via the field app.</p></div>`;
    return;
  }
  el.innerHTML = list.map(e => renderCard(e)).join('');
}

/* ── Card ── */
function renderCard(e) {
  const ago = timeAgo(e.created_at);
  const condClass = { Excellent:'good', Good:'good', Fair:'fair', Poor:'poor', 'Dead/Hazardous':'dead' }[e.condition] || 'fair';
  const riskClass  = { Low:'low', Moderate:'moderate', High:'high', Extreme:'poor' }[e.isa_risk_rating] || 'moderate';

  const contactHtml = (e.customer_name || e.customer_phone || e.customer_address) ? `
    <div class="contact-block">
      ${e.customer_name    ? `<div class="contact-row"><span class="icon">👤</span><span>${esc(e.customer_name)}</span></div>` : ''}
      ${e.customer_phone   ? `<div class="contact-row"><span class="icon">📞</span><a href="tel:${esc(e.customer_phone)}">${esc(e.customer_phone)}</a></div>` : ''}
      ${e.customer_email   ? `<div class="contact-row"><span class="icon">✉️</span><a href="mailto:${esc(e.customer_email)}">${esc(e.customer_email)}</a></div>` : ''}
      ${e.job_address      ? `<div class="contact-row"><span class="icon">📍</span><span>${esc(e.job_address)}</span></div>` : ''}
    </div>` : '<div class="no-contact">No contact info saved</div>';

  const notesHtml = (e.ai_notes || []).length ? `<ul class="notes-items">${(e.ai_notes||[]).map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '<div class="no-contact">No observations</div>';

  const internalHtml = e.internal_notes ? `<div class="internal-note-box"><strong>🔒 Estimator notes</strong>${esc(e.internal_notes)}</div>` : '<div class="no-contact">No internal notes</div>';

  const footerHtml = e.status === 'pending' ? `
    <div class="est-footer">
      <div class="review-form">
        <div>
          <div class="review-label">Manager notes (visible to customer if shared)</div>
          <textarea class="review-textarea" id="mnotes-${e.id}" rows="2" placeholder="Add scope clarifications, conditions, or next steps…"></textarea>
        </div>
        <div class="review-row">
          <div>
            <div class="review-label">Approved quote low ($)</div>
            <input class="review-input" type="number" id="qlo-${e.id}" value="${e.quote_low||''}" style="width:120px;">
          </div>
          <div>
            <div class="review-label">Approved quote high ($)</div>
            <input class="review-input" type="number" id="qhi-${e.id}" value="${e.quote_high||''}" style="width:120px;">
          </div>
        </div>
        <div class="review-actions">
          <button class="btn-approve"  onclick="updateEstimate('${e.id}','approved')">✓ Approve &amp; confirm quote</button>
          <button class="btn-schedule" onclick="updateEstimate('${e.id}','scheduled')">📅 Mark as scheduled</button>
          <button class="btn-reject"   onclick="updateEstimate('${e.id}','rejected')">✕ Reject</button>
        </div>
      </div>
    </div>` : e.status !== 'pending' ? `
    <div class="est-footer">
      <div class="approved-summary">
        <div><div class="lbl">Decision</div><div class="val">${e.status.charAt(0).toUpperCase() + e.status.slice(1)}</div></div>
        ${e.approved_quote_low ? `<div><div class="lbl">Approved quote</div><div class="val">$${num(e.approved_quote_low)} – $${num(e.approved_quote_high)}</div></div>` : ''}
        ${e.approved_at ? `<div><div class="lbl">Decided</div><div class="val">${timeAgo(e.approved_at)}</div></div>` : ''}
        ${e.quote_sent_at ? `<div><div class="lbl">Quote sent</div><div class="val">${timeAgo(e.quote_sent_at)}</div></div>` : ''}
        ${e.manager_notes ? `<div style="width:100%;"><div class="lbl">Manager notes</div><div style="font-size:.85rem;margin-top:2px;">${esc(e.manager_notes)}</div></div>` : ''}
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${e.customer_email
            ? e.quote_sent_at
              ? `<span class="sent-badge">✓ Quote sent ${timeAgo(e.quote_sent_at)}</span>
                 <button class="btn-send" style="font-size:.8rem;padding:7px 14px;" onclick="sendQuote('${e.id}',this)">↺ Resend</button>`
              : `<button class="btn-send" onclick="sendQuote('${e.id}',this)">✉ Send quote to customer</button>`
            : `<span style="font-size:.78rem;color:var(--muted);">No email — can't send</span>`
          }
          <button class="btn-approve" style="background:transparent;color:var(--muted);border:1px solid var(--line);font-size:.78rem;padding:7px 12px;" onclick="resetToPending('${e.id}')">↩ Reset</button>
        </div>
      </div>
    </div>` : '';

  return `
  <div class="est-card ${e.status}" id="card-${e.id}">
    <div class="est-header">
      ${e.photo_url
        ? `<img class="est-photo" src="${esc(e.photo_url)}" alt="Tree photo" onclick="openPhoto('${esc(e.photo_url)}')" title="Click to view full photo">`
        : `<div class="est-photo-placeholder"><i class="ti ti-photo-off" aria-hidden="true"></i></div>`
      }
      <div class="est-meta">
        <div class="est-id">#${e.id.substring(0,8).toUpperCase()}</div>
        <div class="est-species">${esc(e.species || 'Unknown tree')}</div>
        <div class="est-latin">${esc(e.latin_name || '')}</div>
      </div>
      <div class="est-right">
        <div class="est-time">${ago}</div>
        <span class="status-pill pill-${e.status}">${e.status}</span>
      </div>
    </div>
    <div class="est-body">
      <div class="est-section">
        <h4>Assessment</h4>
        <div class="fact-row"><span class="fact-key">Condition</span><span class="fact-val"><span class="badge-sm badge-${condClass}">${esc(e.condition||'—')}</span></span></div>
        <div class="fact-row"><span class="fact-key">ISA risk</span><span class="fact-val"><span class="badge-sm badge-${riskClass}">${esc(e.isa_risk_rating||'—')}</span></span></div>
        <div class="fact-row"><span class="fact-key">Height</span><span class="fact-val">${esc(e.est_height||'—')}</span></div>
        <div class="fact-row"><span class="fact-key">DBH</span><span class="fact-val">${esc(e.est_dbh||'—')}</span></div>
        <div class="fact-row"><span class="fact-key">Crown</span><span class="fact-val">${esc(e.crown_spread||'—')}</span></div>
        <div class="quote-block">
          <div class="lbl">AI estimate</div>
          <div class="amt">${e.quote_low ? '$' + num(e.quote_low) + ' – $' + num(e.quote_high) : '—'}</div>
          <div class="svc">${esc(e.selected_service || e.recommended_service || '—')}</div>
        </div>
      </div>
      <div class="est-section">
        <h4>AI observations</h4>
        ${notesHtml}
        <div style="margin-top:12px;">
          ${internalHtml}
        </div>
      </div>
      <div class="est-section">
        <h4>Customer contact</h4>
        ${contactHtml}
      </div>
    </div>
    ${footerHtml}
  </div>`;
}

/* ── Update estimate ── */
async function updateEstimate(id, status) {
  const notes  = document.getElementById('mnotes-' + id)?.value || '';
  const qLo    = parseInt(document.getElementById('qlo-' + id)?.value) || null;
  const qHi    = parseInt(document.getElementById('qhi-' + id)?.value) || null;
  const { error } = await db.from('estimates').update({
    status,
    manager_notes:      notes,
    approved_quote_low:  qLo,
    approved_quote_high: qHi,
    approved_at:        new Date().toISOString(),
  }).eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  await loadEstimates();
}

async function sendQuote(id, el) {
  const btn = el || event?.target;
  const orig = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  try {
    const resp = await fetch('https://hydlxwjtdkzcnxxukakt.supabase.co/functions/v1/send-quote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ estimate_id: id }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Send failed');
    await loadEstimates();
  } catch (err) {
    alert('Could not send: ' + err.message);
    btn.disabled = false;
    btn.textContent = orig;
  }
}

async function resetToPending(id) {
  await db.from('estimates').update({ status: 'pending', approved_at: null, manager_notes: null }).eq('id', id);
  await loadEstimates();
}

/* ── Helpers ── */
function openPhoto(url) {
  const lb = document.getElementById('photo-lightbox');
  document.getElementById('lightbox-img').src = url;
  lb.style.display = 'flex';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('photo-lightbox').style.display = 'none'; });

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function num(n) { return Number(n).toLocaleString('en-US'); }
function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60)   return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

loadEstimates();
setInterval(loadEstimates, 60000);
